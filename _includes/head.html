{% capture meta_title %}{% if page.title and page.title != "Home" %}{{ page.title }} · {% endif %}{{ site.title }}{% endcapture %}
{% assign meta_description = page.description | default: site.description %}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ meta_description | strip_html | normalize_whitespace | escape }}">
<meta name="color-scheme" content="light dark">
<title>{{ meta_title | escape }}</title>
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ meta_title | escape }}">
<meta property="og:description" content="{{ meta_description | strip_html | normalize_whitespace | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
